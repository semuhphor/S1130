<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
  <title id="t">IBM 1130 computer room</title>
  <desc id="d">Period computer room: 1442 card read punch on the left, 1130 console and desk in the centre, 1403 printer on the right.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9db4c0"/><stop offset="1" stop-color="#7f98a6"/></linearGradient>
    <linearGradient id="sidewall" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6f8795"/><stop offset="1" stop-color="#8aa1ae"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9b6ac"/><stop offset="1" stop-color="#8e8b82"/></linearGradient>
    <linearGradient id="ceil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9e8e2"/><stop offset="1" stop-color="#c9c8c0"/></linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4a7ba6"/><stop offset=".5" stop-color="#5b8bb4"/><stop offset="1" stop-color="#3f6d96"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4d6d6"/><stop offset="1" stop-color="#9ea3a6"/></linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a2c2f"/><stop offset=".5" stop-color="#3b3e42"/><stop offset="1" stop-color="#232528"/></linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f1ec"/><stop offset="1" stop-color="#cfcec6"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="7" flood-color="#000" flood-opacity=".35"/></filter>
    <style>
      .ol   { stroke:#20272d; stroke-width:1.6; stroke-linejoin:round; }
      .txt  { font-family:Arial,Helvetica,sans-serif; fill:#20272d; }
      .wt   { font-family:Arial,Helvetica,sans-serif; fill:#f2f2ee; }
      .lamp { fill:#2c2f33; stroke:#111; stroke-width:1; }
      .lit  { fill:#ffd36b; stroke:#6b4b00; stroke-width:1; }
      .key  { fill:#c8cacb; stroke:#20272d; stroke-width:1; }
      .btn  { fill:#f4f4f0; stroke:#20272d; stroke-width:1.2; }
      #disk-drive.loaded #disk-cartridge { visibility:visible; }
      .hot:hover { filter:brightness(1.1); cursor:pointer; }
    </style>
    <!-- one row of 16 register lamps, with a gap between each group of four -->
    <g id="row16">
      <circle class="lamp" cx="0"   cy="0" r="5"/><circle class="lamp" cx="14"  cy="0" r="5"/>
      <circle class="lamp" cx="28"  cy="0" r="5"/><circle class="lamp" cx="42"  cy="0" r="5"/>
      <circle class="lamp" cx="64"  cy="0" r="5"/><circle class="lamp" cx="78"  cy="0" r="5"/>
      <circle class="lamp" cx="92"  cy="0" r="5"/><circle class="lamp" cx="106" cy="0" r="5"/>
      <circle class="lamp" cx="128" cy="0" r="5"/><circle class="lamp" cx="142" cy="0" r="5"/>
      <circle class="lamp" cx="156" cy="0" r="5"/><circle class="lamp" cx="170" cy="0" r="5"/>
      <circle class="lamp" cx="192" cy="0" r="5"/><circle class="lamp" cx="206" cy="0" r="5"/>
      <circle class="lamp" cx="220" cy="0" r="5"/><circle class="lamp" cx="234" cy="0" r="5"/>
    </g>
    <g id="fn">
      <rect class="btn" x="0" y="0" width="38" height="26" rx="2"/>
    </g>
  </defs>

  <!-- room -->
  <rect width="1600" height="900" fill="url(#wall)"/>
  <polygon points="0,0 1600,0 1330,215 270,215" fill="url(#ceil)" class="ol"/>
  <polygon points="0,900 1600,900 1330,690 270,690" fill="url(#floor)" class="ol"/>
  <polygon points="0,0 270,215 270,690 0,900" fill="url(#sidewall)" class="ol"/>
  <polygon points="1600,0 1330,215 1330,690 1600,900" fill="url(#sidewall)" class="ol"/>
  <rect x="270" y="215" width="1060" height="475" fill="url(#wall)" class="ol"/>
  <rect x="270" y="640" width="1060" height="50" fill="#6f8795" opacity=".45"/>

  <!-- ceiling light panels -->
  <g class="ol" fill="#f7f6ee">
    <polygon points="520,45 720,45 700,100 540,100"/><polygon points="880,45 1080,45 1060,100 900,100"/>
  </g>

  <!-- wall clock -->
  <g class="ol"><circle cx="410" cy="310" r="32" fill="#f4f4f0"/><circle cx="410" cy="310" r="27" fill="none" stroke="#999" stroke-width="1"/><path d="M410 310 V288 M410 310 L425 318" fill="none" stroke="#20272d" stroke-width="2.5"/></g>
  <!-- wall notice -->
  <g class="ol"><rect x="1140" y="280" width="110" height="80" fill="#f1f0e6"/></g>
  <g class="txt" font-size="12" text-anchor="middle"><text x="1195" y="305" font-weight="bold" font-size="16">IBM 1130</text><text x="1195" y="325">COMPUTING</text><text x="1195" y="341">SYSTEM</text></g>

  <!-- floor seams -->
  <g stroke="#7d7a72" stroke-width="1" opacity=".5">
    <line x1="270" y1="690" x2="60" y2="900"/><line x1="560" y1="690" x2="440" y2="900"/>
    <line x1="800" y1="690" x2="800" y2="900"/><line x1="1040" y1="690" x2="1160" y2="900"/>
    <line x1="1330" y1="690" x2="1540" y2="900"/><line x1="150" y1="780" x2="1450" y2="780"/><line x1="60" y1="860" x2="1540" y2="860"/>
  </g>

  <!-- ================= 1442 Card Read Punch ================= -->
  <g id="card-reader" class="hot" filter="url(#shadow)">
    <!-- two-door base -->
    <rect x="130" y="530" width="290" height="200" fill="url(#cab)" class="ol"/>
    <line x1="275" y1="530" x2="275" y2="730" class="ol"/>
    <rect x="138" y="540" width="130" height="182" fill="none" stroke="#20272d" stroke-opacity=".35"/>
    <rect x="283" y="540" width="130" height="182" fill="none" stroke="#20272d" stroke-opacity=".35"/>
    <rect x="255" y="610" width="12" height="28" rx="2" fill="#c9ccce" class="ol"/><rect x="283" y="610" width="12" height="28" rx="2" fill="#c9ccce" class="ol"/>
    <rect x="130" y="522" width="290" height="10" fill="#b7bbbd" class="ol"/>
    <!-- left tall grey section (punch / read unit) -->
    <rect x="130" y="400" width="130" height="122" fill="url(#metal)" class="ol"/>
    <rect x="140" y="412" width="110" height="98" fill="none" stroke="#20272d" stroke-opacity=".3"/>
    <!-- right deck -->
    <rect x="260" y="448" width="160" height="74" fill="#cfd1d2" class="ol"/>
    <!-- hopper with cards -->
    <polygon points="278,448 372,448 366,408 284,408" fill="#e8e5d4" class="ol"/>
    <rect x="288" y="418" width="68" height="30" fill="#f3e7b0" class="ol"/>
    <g stroke="#a89a5a" stroke-width="1"><line x1="291" y1="426" x2="353" y2="426"/><line x1="291" y1="433" x2="353" y2="433"/><line x1="291" y1="440" x2="353" y2="440"/></g>
    <!-- stackers -->
    <rect x="272" y="470" width="86" height="40" rx="2" fill="#8f9498" class="ol"/>
    <rect x="278" y="492" width="74" height="12" fill="#f3e7b0" class="ol"/>
    <!-- control panel -->
    <rect x="372" y="452" width="44" height="44" fill="#2e3236" class="ol"/>
    <rect x="378" y="458" width="14" height="9" fill="#6fd07a" class="ol"/><rect x="396" y="458" width="14" height="9" fill="#e8e8e0" class="ol"/>
    <rect x="378" y="471" width="14" height="9" fill="#e8e8e0" class="ol"/><rect x="396" y="471" width="14" height="9" fill="#e86a5a" class="ol"/>
    <rect x="378" y="484" width="32" height="8" fill="#e8e8e0" class="ol"/>
    <text x="195" y="468" class="txt" font-size="14" font-weight="bold" text-anchor="middle">IBM 1442</text>
    <text x="195" y="486" class="txt" font-size="10" text-anchor="middle">CARD READ PUNCH</text>
    <text x="275" y="768" class="txt" font-size="18" text-anchor="middle" font-weight="bold">1442 Card Read Punch</text>
  </g>

  <!-- ================= 1130 console ================= -->
  <g id="console" class="hot" filter="url(#shadow)">
    <!-- desk -->
    <rect x="470" y="560" width="660" height="170" fill="url(#cab)" class="ol"/>
    <rect x="610" y="578" width="380" height="152" fill="#171b1f" class="ol"/>
    <rect x="480" y="578" width="120" height="140" fill="none" stroke="#20272d" stroke-opacity=".35"/>
    <rect x="1000" y="578" width="120" height="140" fill="none" stroke="#20272d" stroke-opacity=".35"/>
    <!-- 2310 disk drive: set class="loaded" on #disk-drive to show the cartridge -->
    <g id="disk-drive">
      <rect x="1008" y="588" width="104" height="82" rx="3" fill="#aeb2b4" class="ol"/>
      <rect x="1016" y="596" width="88" height="50" rx="2" fill="#0d1013" class="ol"/>
      <rect x="1016" y="596" width="88" height="8" fill="#000" opacity=".5"/>
      <rect x="1022" y="652" width="30" height="10" rx="2" fill="#d6d8d8" class="ol"/>
      <circle cx="1090" cy="657" r="3.5" fill="#6fd07a" class="ol"/>
      <text x="1060" y="682" class="txt" font-size="7" text-anchor="middle">2310 DISK STORAGE</text>
      <g id="disk-cartridge" visibility="hidden">
        <rect x="1020" y="604" width="80" height="44" rx="3" fill="#e4e2d8" class="ol"/>
        <rect x="1028" y="612" width="64" height="16" rx="1" fill="#f7f6ee" class="ol"/>
        <text x="1060" y="624" class="txt" font-size="8" text-anchor="middle" font-weight="bold">2315</text>
        <path d="M1034 604 V586 Q1034 578 1042 578 H1078 Q1086 578 1086 586 V604" fill="none" stroke="#20272d" stroke-width="5" stroke-linecap="round"/>
        <path d="M1034 604 V586 Q1034 578 1042 578 H1078 Q1086 578 1086 586 V604" fill="none" stroke="#c9cbcb" stroke-width="2.5" stroke-linecap="round"/>
        <rect x="1020" y="640" width="80" height="8" fill="#b8b6ac" class="ol"/>
      </g>
    </g>
    <polygon points="450,548 1150,548 1130,562 470,562" fill="#b8b7ae" class="ol"/>
    <rect x="450" y="538" width="700" height="12" fill="url(#desk)" class="ol"/>
    <!-- console panel on the desk -->
    <polygon points="470,538 1130,538 1105,468 495,468" fill="#b5b8ba" class="ol"/>
    <!-- function lights and switches, left -->
    <g class="txt" font-size="6.5" text-anchor="middle">
      <rect class="btn" x="505" y="482" width="36" height="20" rx="2"/><text x="523" y="495">RUN</text>
      <rect class="btn" x="545" y="482" width="36" height="20" rx="2"/><text x="563" y="495">PARITY</text>
      <rect class="btn" x="505" y="508" width="36" height="20" rx="2"/><text x="523" y="521">DISK UNLK</text>
      <rect class="btn" x="545" y="508" width="36" height="20" rx="2"/><text x="563" y="521">FORMS</text>
    </g>
    <!-- keyboard -->
    <polygon points="665,534 935,534 950,495 650,495" fill="#9ea2a4" class="ol"/>
    <g>
      <rect class="key" x="662" y="500" width="14" height="9"/><rect class="key" x="680" y="500" width="14" height="9"/>
      <rect class="key" x="698" y="500" width="14" height="9"/><rect class="key" x="716" y="500" width="14" height="9"/>
      <rect class="key" x="734" y="500" width="14" height="9"/><rect class="key" x="752" y="500" width="14" height="9"/>
      <rect class="key" x="770" y="500" width="14" height="9"/><rect class="key" x="788" y="500" width="14" height="9"/>
      <rect class="key" x="806" y="500" width="14" height="9"/><rect class="key" x="824" y="500" width="14" height="9"/>
      <rect class="key" x="842" y="500" width="14" height="9"/><rect class="key" x="860" y="500" width="14" height="9"/>
      <rect class="key" x="874" y="512" width="14" height="9"/>
      <rect class="key" x="668" y="512" width="14" height="9"/><rect class="key" x="686" y="512" width="14" height="9"/>
      <rect class="key" x="704" y="512" width="14" height="9"/><rect class="key" x="722" y="512" width="14" height="9"/>
      <rect class="key" x="740" y="512" width="14" height="9"/><rect class="key" x="758" y="512" width="14" height="9"/>
      <rect class="key" x="776" y="512" width="14" height="9"/><rect class="key" x="794" y="512" width="14" height="9"/>
      <rect class="key" x="812" y="512" width="14" height="9"/><rect class="key" x="830" y="512" width="14" height="9"/>
      <rect class="key" x="848" y="512" width="14" height="9"/>
      <rect class="key" x="700" y="524" width="200" height="7"/>
    </g>
    <!-- function switches, right -->
    <g class="txt" font-size="6.5" text-anchor="middle">
      <rect class="btn" x="1019" y="482" width="36" height="20" rx="2"/><text x="1037" y="492">PROGRAM</text><text x="1037" y="500">START</text>
      <rect class="btn" x="1059" y="482" width="36" height="20" rx="2"/><text x="1077" y="495">IMM STOP</text>
      <rect class="btn" x="1019" y="508" width="36" height="20" rx="2"/><text x="1037" y="518">PROGRAM</text><text x="1037" y="526">LOAD</text>
      <rect class="btn" x="1059" y="508" width="36" height="20" rx="2"/><text x="1077" y="521">RESET</text>
    </g>
    <!-- lamp panel on its posts -->
    <rect x="626" y="440" width="10" height="34" fill="#8d9296" class="ol"/><rect x="964" y="440" width="10" height="34" fill="#8d9296" class="ol"/>
    <rect x="496" y="296" width="608" height="150" fill="#2a2f34" class="ol"/>
    <rect x="504" y="304" width="592" height="134" fill="#d9dad4" class="ol"/>
    <!-- register labels and lamps (IAR, SAR, SBR, AFR, ACC, EXT) -->
    <g class="txt" font-size="8">
      <text x="510" y="324">INSTRUCTION ADDR</text><text x="510" y="345">STORAGE ADDR</text><text x="510" y="366">STORAGE BUFFER</text>
      <text x="510" y="387">ARITHMETIC FACTOR</text><text x="510" y="408">ACCUMULATOR</text><text x="510" y="429">ACCUM EXTENSION</text>
    </g>
    <g>
      <use xlink:href="#row16" x="620" y="321"/><use xlink:href="#row16" x="620" y="342"/>
      <use xlink:href="#row16" x="620" y="363"/><use xlink:href="#row16" x="620" y="384"/>
      <use xlink:href="#row16" x="620" y="405"/><use xlink:href="#row16" x="620" y="426"/>
    </g>
    <g>
      <circle class="lit" cx="748" cy="321" r="5"/><circle class="lit" cx="776" cy="321" r="5"/><circle class="lit" cx="854" cy="321" r="5"/>
      <circle class="lit" cx="662" cy="342" r="5"/><circle class="lit" cx="748" cy="342" r="5"/>
      <circle class="lit" cx="634" cy="363" r="5"/><circle class="lit" cx="726" cy="363" r="5"/><circle class="lit" cx="840" cy="363" r="5"/>
      <circle class="lit" cx="812" cy="405" r="5"/><circle class="lit" cx="854" cy="405" r="5"/>
    </g>
    <!-- right-hand lamp groups: indicators, op register, interrupt levels, condition -->
    <g class="txt" font-size="8"><text x="885" y="324">OPERATION REG</text><text x="885" y="345">INDEX REG</text><text x="885" y="366">INTERRUPT LEVELS</text><text x="885" y="387">CYCLE COUNTER</text><text x="885" y="408">CONDITION</text></g>
    <g>
      <circle class="lamp" cx="985" cy="321" r="5"/><circle class="lit" cx="1000" cy="321" r="5"/><circle class="lamp" cx="1015" cy="321" r="5"/><circle class="lamp" cx="1030" cy="321" r="5"/><circle class="lamp" cx="1045" cy="321" r="5"/>
      <circle class="lamp" cx="1000" cy="342" r="5"/><circle class="lit" cx="1015" cy="342" r="5"/><circle class="lamp" cx="1030" cy="342" r="5"/>
      <circle class="lamp" cx="985" cy="363" r="5"/><circle class="lamp" cx="1000" cy="363" r="5"/><circle class="lamp" cx="1015" cy="363" r="5"/><circle class="lamp" cx="1030" cy="363" r="5"/><circle class="lit" cx="1045" cy="363" r="5"/><circle class="lamp" cx="1060" cy="363" r="5"/>
      <circle class="lamp" cx="985" cy="384" r="5"/><circle class="lamp" cx="1000" cy="384" r="5"/><circle class="lit" cx="1015" cy="384" r="5"/><circle class="lamp" cx="1030" cy="384" r="5"/><circle class="lamp" cx="1045" cy="384" r="5"/><circle class="lamp" cx="1060" cy="384" r="5"/>
      <circle class="lit" cx="1000" cy="405" r="5"/><circle class="lamp" cx="1015" cy="405" r="5"/>
    </g>
    <text x="800" y="432" class="txt" font-size="9" text-anchor="middle" font-weight="bold" fill-opacity="0">IBM 1130</text>
    <!-- power / keyboard select, top corners -->
    <rect class="btn" x="470" y="296" width="0" height="0"/>
    <text x="800" y="768" class="txt" font-size="18" text-anchor="middle" font-weight="bold">1131 Central Processing Unit and Console</text>
  </g>

  <!-- ================= 1403 Printer ================= -->
  <g id="printer" class="hot" filter="url(#shadow)">
    <!-- legs with casters -->
    <g stroke="#20272d" stroke-width="5" stroke-linecap="round">
      <line x1="1240" y1="640" x2="1225" y2="800"/><line x1="1470" y1="640" x2="1485" y2="800"/><line x1="1215" y1="800" x2="1495" y2="800"/>
    </g>
    <circle cx="1220" cy="812" r="9" fill="#444" class="ol"/><circle cx="1490" cy="812" r="9" fill="#444" class="ol"/>
    <!-- paper curtain -->
    <polygon points="1290,660 1420,660 1438,790 1272,790" fill="#f8f8f2" class="ol"/>
    <g stroke="#9bc5b2" stroke-width="1.5"><line x1="1292" y1="690" x2="1418" y2="690"/><line x1="1288" y1="720" x2="1422" y2="720"/><line x1="1284" y1="750" x2="1426" y2="750"/><line x1="1280" y1="780" x2="1430" y2="780"/></g>
    <g stroke="#bbb" stroke-width="1"><line x1="1310" y1="660" x2="1296" y2="790"/><line x1="1400" y1="660" x2="1414" y2="790"/></g>
    <!-- hood -->
    <rect x="1195" y="480" width="300" height="180" rx="4" fill="url(#hood)" class="ol"/>
    <polygon points="1195,480 1495,480 1480,420 1210,420" fill="#2f3235" class="ol"/>
    <polygon points="1255,478 1435,478 1424,436 1266,436" fill="#586068" opacity=".8" class="ol"/>
    <rect x="1220" y="508" width="250" height="120" rx="2" fill="none" stroke="#6b7076" stroke-opacity=".6"/>
    <rect x="1405" y="498" width="62" height="18" fill="#d8d8d2" class="ol"/>
    <text x="1436" y="511" class="txt" font-size="11" text-anchor="middle" font-weight="bold">IBM 1403</text>
    <!-- operator keys -->
    <rect x="1176" y="450" width="40" height="64" rx="3" fill="#4a7ba6" class="ol"/>
    <circle cx="1190" cy="466" r="5" fill="#6fd07a" class="ol"/><circle cx="1204" cy="466" r="5" fill="#e86a5a" class="ol"/>
    <rect x="1182" y="480" width="28" height="9" fill="#e8e8e0" class="ol"/><rect x="1182" y="494" width="28" height="9" fill="#e8e8e0" class="ol"/>
    <text x="1345" y="870" class="txt" font-size="18" text-anchor="middle" font-weight="bold">1403 Printer</text>
  </g>
</svg>
